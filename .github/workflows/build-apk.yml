name: 构建 APK

# 什么时候触发：推送到 main/master 分支时自动构建，也可以在网页上手动点按钮触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 云端编译 Android APK
    runs-on: ubuntu-22.04
    # 首次构建需要下载 Android SDK/NDK 并编译 Python，耗时较长
    timeout-minutes: 120

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake autopoint gettext ccache

      - name: 5. 安装 Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 6. 安装 Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.34 virtualenv

      - name: 7. 缓存 SDK / NDK / 编译中间产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.ccache
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 8. 编译 debug 版 APK
        # PIP_CONSTRAINT 用于约束 p4a 内部的依赖解析，避免它选中 Android 专用 wheel
        # 后又在安装阶段被 pip 拒绝（详见 constraints.txt 与 README 的 FAQ Q8）
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: buildozer -v android debug

      - name: 9. 查看产物大小
        run: ls -lh bin/

      - name: 10. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: lvlian-ble-assistant-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
